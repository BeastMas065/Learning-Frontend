<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Inventory</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1 id="title">Book Inventory</h1>
    </header>
    <main>
        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Category</th>
                    <th>Status</th>
                    <th>Rate</th>
                </tr>
            </thead>
            <tbody>
                <tr class="read">
                    <td>Rich Dad Poor Dad</td>
                    <td>Robert Kiyosaki</td>
                    <td>Finance</td>
                    <td><span class="status">Read</span></td>
                    <td><span class="rate two"><span></span><span></span><span></span></span></td>
                </tr>
                <tr class="read">
                    <td>How to Talk to Anyone</td>
                    <td>Leil Lowndes</td>
                    <td>Self Help</td>
                    <td><span class="status">Read</span></td>
                    <td><span class="rate three"><span></span><span></span><span></span></span></td>
                </tr>
                <tr class="in-progress">
                    <td>48 Laws of Power</td>
                    <td>Robert Greene</td>
                    <td>Self Help</td>
                    <td><span class="status">In Progress</span></td>
                    <td><span class="rate"><span></span><span></span><span></span></span></td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
