<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feature Selection</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Feature Selection</h1>

    <div class="feature-card-container">

        <label class="feature-card">
            <input type="checkbox">
            <h2>Cloud Backup</h2>
            <p>Store your files safely in the cloud.</p>
        </label>

        <label class="feature-card">
            <input type="checkbox">
            <h2>Priority Support</h2>
            <p>Get help anytime from our experts.</p>
        </label>

        <label class="feature-card">
            <input type="checkbox">
            <h2>Dark Mode</h2>
            <p>Reduce eye strain with dark theme.</p>
        </label>

        <label class="feature-card">
            <input type="checkbox">
            <h2>API Access</h2>
            <p>Integrate with your favorite tools.</p>
        </label>

    </div>

</body>
</html>
