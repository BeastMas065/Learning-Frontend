<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Availibility Table</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <table>
        <caption>Weekly Meeting Available Schedule</caption>
        <thead>
            <tr class="sharp">
                <th></th>
                <th scope="col">Sunday</th>
                <th scope="col">Monday</th>
                <th scope="col">Tuesday</th>
                <th scope="col">Wednesday</th>
                <th scope="col">Thursday</th>
                <th scope="col">Friday</th>
                <th scope="col">Saturday</th>
            </tr>
        </thead>
        <tbody>
            <tr class="half">
                <th class="time" scope="row"><time datetime="08:00">8 AM</time></th>
                <td class="available-0" aria-label="0 available"></td>
                <td class="available-1" aria-label="1 available"></td>
                <td class="available-0" aria-label="0 available"></td>
                <td class="available-4" aria-label="4 available"></td>
                <td class="available-0" aria-label="0 available"></td>
                <td class="available-0" aria-label="0 available"></td>
                <td class="available-5" aria-label="5+ available"></td>
            </tr>
            <tr class="sharp">
                <th class="time" scope="row"><time datetime="12:00">12 PM</time></th>
                <td class="available-4" aria-label="4 available"></td>
                <td class="available-0" aria-label="0 available"></td>
                <td class="available-3" aria-label="3 available"></td>
                <td class="available-0" aria-label="0 available"></td>
                <td class="available-0" aria-label="0 available"></td>
                <td class="available-1" aria-label="1 available"></td>
                <td class="available-0" aria-label="0 available"></td>
            </tr>
            <tr class="half">
                <th class="time" scope="row"><time datetime="16:00">4 PM</time></th>
                <td class="available-5" aria-label="5+ available"></td>
                <td class="available-2" aria-label="2 available"></td>
                <td class="available-0" aria-label="0 available"></td>
                <td class="available-2" aria-label="2 available"></td>
                <td class="available-0" aria-label="0 available"></td>
                <td class="available-3" aria-label="3 available"></td>
                <td class="available-0" aria-label="0 available"></td>
            </tr>
            <tr class="sharp">
                <th class="time" scope="row"><time datetime="20:00">8 PM</time></th>
                <td class="available-5" aria-label="5+ available"></td>
                <td class="available-2" aria-label="2 available"></td>
                <td class="available-0" aria-label="0 available"></td>
                <td class="available-2" aria-label="2 available"></td>
                <td class="available-0" aria-label="0 available"></td>
                <td class="available-3" aria-label="3 available"></td>
                <td class="available-0" aria-label="0 available"></td>
            </tr>
        </tbody>
    </table>
    <div id="legend">
        <span>Availabilty</span>
        <div id="legend-gradient"></div>
    </div>

</body>
</html>
